<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Toggle Nav</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.js" defer></script> <!-- javascript uses script> source> attribute. Defer, means wait until everything loads first then load the js code. -->
</head>
<body>
    <header>
        <h1>Ice Cream</h1>
        <button class="toggle-btn">Menu</button> <!-- in css since there is only one btn you can select it directly but when you move to javascript you might have to select multiple btns. best practice is to give your btn a class. --> 
        <nav class="main-menu">
            <ul>
                <li><a href="#">Chocolate</a></li>
                <li><a href="#">Cookies & Cream</a></li>
                <li><a href="#">Strawberry</a></li>
                <li><a href="#">Mint Chocolate Chip</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Today's Flavours</h2>
        <p>Small-batch ice cream made fresh every morning. Stop by for a scoop, a cone, or a pint to take home.</p>
        <p>New this week are maple walnut and salted caramel.</p>
    </main>
</body>
</html>
